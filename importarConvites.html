<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Importar Convites</title>
</head>
<body>
  <h1>Importar convites para o Firebase</h1>

  <button id="btnImportar">Importar convites</button>

  <pre id="resultado"></pre>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "casamento-suelen-felipe.firebaseapp.com",
      projectId: "casamento-suelen-felipe",
      storageBucket: "casamento-suelen-felipe.firebasestorage.app",
      messagingSenderId: "304619466326",
      appId: "1:304619466326:web:6be173a3612945781e55f7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const resultado = document.getElementById("resultado");

    async function importarConvites() {
      resultado.textContent = "Carregando JSON...\n";

      const resposta = await fetch("./convites_firebase_atualizado.json");
      const convites = await resposta.json();

      const codigos = Object.keys(convites);

      resultado.textContent += `Encontrados ${codigos.length} convites.\n\n`;

      for (const codigo of codigos) {
        const dados = convites[codigo];

        await setDoc(doc(db, "convites", codigo), {
          ...dados,
          codigo: codigo
        });

        resultado.textContent += `✅ Importado: ${codigo} - ${dados.nomeConvite}\n`;
      }

      resultado.textContent += "\nImportação concluída com sucesso!";
    }

    document.getElementById("btnImportar").addEventListener("click", importarConvites);
  </script>
</body>
</html>
